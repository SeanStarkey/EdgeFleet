name: edgefleet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edgefleet
      POSTGRES_USER: edgefleet
      POSTGRES_PASSWORD: edgefleet-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgefleet -d edgefleet"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  control-plane:
    image: rust:1.95-slim-bookworm
    working_dir: /workspace
    environment:
      RUST_LOG: info
      EDGEFLEET_DATABASE_URL: postgres://edgefleet:edgefleet-dev@postgres:5432/edgefleet
      EDGEFLEET_NATS_URL: nats://nats:4222
      EDGEFLEET_BIND_ADDR: 0.0.0.0:8080
    command: ["cargo", "run", "-p", "control-plane"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target

  edge-agent:
    image: rust:1.95-slim-bookworm
    working_dir: /workspace
    environment:
      RUST_LOG: info
      EDGEFLEET_CONTROL_PLANE_URL: http://control-plane:8080
      EDGEFLEET_DEVICE_ID: edge-local-001
    command: ["cargo", "run", "-p", "edge-agent"]
    depends_on:
      control-plane:
        condition: service_started
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target

  fleet-simulator:
    image: rust:1.95-slim-bookworm
    working_dir: /workspace
    environment:
      RUST_LOG: info
      EDGEFLEET_CONTROL_PLANE_URL: http://control-plane:8080
      EDGEFLEET_SIMULATED_AGENTS: "3"
    command: ["cargo", "run", "-p", "fleet-simulator"]
    depends_on:
      control-plane:
        condition: service_started
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target

  dashboard:
    image: node:22-alpine
    profiles: ["dashboard"]
    working_dir: /workspace/dashboard
    environment:
      VITE_EDGEFLEET_API_URL: http://localhost:8080
    command:
      - sh
      - -c
      - |
        if [ -f package.json ]; then
          npm install
          npm run dev -- --host 0.0.0.0
        else
          echo "Dashboard scaffold is not present yet; enable this service after the Phase 0 dashboard scaffold lands."
          sleep infinity
        fi
    depends_on:
      control-plane:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - dashboard-node-modules:/workspace/dashboard/node_modules

volumes:
  postgres-data:
  cargo-registry:
  cargo-git:
  cargo-target:
  dashboard-node-modules:
