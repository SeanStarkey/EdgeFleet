[workspace]
members = [
    "crates/control-plane",
    "crates/edge-agent",
    "crates/edgefleet-types",
    "crates/fleet-simulator",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
control-plane = { path = "crates/control-plane" }
edgefleet-types = { path = "crates/edgefleet-types" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4", "v7"] }
