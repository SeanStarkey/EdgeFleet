[workspace]
members = [
    "crates/control-plane",
    "crates/edge-agent",
    "crates/edgefleet-types",
    "crates/fleet-simulator",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
edgefleet-types = { path = "crates/edgefleet-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.41"
